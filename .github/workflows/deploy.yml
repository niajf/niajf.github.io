name: Deploy to GitHub Pages

# main をトップ (/)、develop を /develop/ に置き、1 つのサイトとして公開する。
# どちらのブランチに push しても両方をビルドし直すので、このファイルは main と develop で同じ内容にしておく。
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            develop/package-lock.json
      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm run build
      - name: Build develop
        working-directory: develop
        run: |
          npm ci
          npm run build -- --base /develop
      - name: Combine
        run: |
          mkdir site
          cp -r main/dist/. site/
          cp -r develop/dist site/develop
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
